[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relayguard"
version = "0.1.0"
description = "Serverless webhook reliability and replay service"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = '-q -m "not e2e"'
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "e2e: tests that require a provisioned and deployed backend environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

