version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Dublin
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Dublin
    groups:
      frontend-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Dublin
    groups:
      backend-node-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Dublin
    groups:
      backend-python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directories:
      - /iac/terraform-modules/aws/cloudwatch-sqs-alarms
      - /iac/terraform-modules/aws/dynamodb
      - /iac/terraform-modules/aws/eventbridge
      - /iac/terraform-modules/aws/iam-policy
      - /iac/terraform-modules/aws/iam-role
      - /iac/terraform-modules/aws/localstack
      - /iac/terraform-modules/aws/s3
      - /iac/terraform-modules/aws/secrets-manager
      - /iac/terraform-modules/aws/sns
      - /iac/terraform-modules/aws/sqs
      - /iac/terraform-modules/aws/ssm-parameters
      - /iac/terraform-modules/azure/blob-storage
      - /iac/terraform-modules/gcp/storage-bucket
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    groups:
      terraform-providers:
        patterns: ["*"]
    open-pull-requests-limit: 5
